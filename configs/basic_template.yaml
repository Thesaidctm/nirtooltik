data:
  input_path: data/raw/data.xlsx
  x_sheet: X
  y_sheet: Y
  target_cols: all
  spectral_range: null
  drop_nans: true
  out_dir: results

preprocess:
  steps: [SNV]

models:
  - name: PLSDA
    # Mantenha `n_components` abaixo de 80% de min(n_amostras - 1, n_variáveis)
    # para reduzir risco de sobreajuste
    grid: {n_components: [5]}
    # overfit_check: false  # desativa Y-scrambling (ativo por padrão)

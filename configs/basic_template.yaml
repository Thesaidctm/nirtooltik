data:
  input_path: data/raw/data.xlsx
  x_sheet: X
  y_sheet: Y
  target_cols: all
  spectral_range: null
  drop_nans: true
  out_dir: results

preprocess:
  steps: [SNV]
  # Defina como true para avaliar cada pré-processo isoladamente
  evaluate_individual: false

models:
  - name: PLSDA
    # Mantenha `n_components` abaixo de 80% de min(n_amostras - 1, n_variáveis)
    # para reduzir risco de sobreajuste
    grid: {n_components: [5], method: [logreg, lda]}
    # y_scramble_n_iter: 5  # reduz iterações de Y-scrambling (0 desativa)
    # overfit_check: false  # desativa Y-scrambling por completo

# Para receber notificações por e-mail configure as variáveis de ambiente
# NIRCLS_EMAIL_HOST, NIRCLS_EMAIL_PORT, NIRCLS_EMAIL_USER, NIRCLS_EMAIL_PASS e
# NIRCLS_EMAIL_TO.

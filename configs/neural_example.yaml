data:
  input_path: data/raw/*.xlsx
  x_sheet: X
  y_sheet: Y
  target_cols: all
  spectral_range: null
  drop_nans: true
  out_dir: results

preprocess:
  steps: [SNV, SCALE]

models:
  - name: CNN1D
    grid:
      n_filters: [16, 32]
      kernel_size: [3, 5]
      n_epochs: [20]
      lr: [0.001]
    # y_scramble_n_iter: 5  # reduz iterações de Y-scrambling (0 desativa)
    # overfit_check: false  # desativa Y-scrambling por completo
  - name: LSTM1D
    grid:
      hidden_dim: [64, 128]
      num_layers: [1, 2]
      n_epochs: [20]
      lr: [0.001]
    # y_scramble_n_iter: 5  # reduz iterações de Y-scrambling (0 desativa)
    # overfit_check: false  # desativa Y-scrambling por completo

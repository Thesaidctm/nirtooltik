
data:
  input_path: data/raw/*.xlsx
  x_sheet: X
  y_sheet: Y
  target_cols: all   # ou uma lista explícita de colunas
  spectral_range: null
  drop_nans: true
  out_dir: results

preprocess:
  evaluate_individual: true
  steps: [SNV,MSC, SG, EPO, SCALE]
  sg:
    window: [3,7,11,15,21,25]
    polyorder: 2
    deriv: [1,2]

cv:
  random_state: 42
  cv_method: spxy
  strategies:
    - type: kfold
      n_splits: [5,10]
      n_repeats: 2
    - type: loo
    - type: holdout
      test_size: 0.3

models:
  - name: PLSDA
    grid: {n_components: [5,10], method: [lda, qda], C: [0.5,1.0,2.0]}
    # overfit_check: false  # desativa Y-scrambling (ativo por padrão)

  - name: RF
    grid: {n_estimators: [200,400], max_depth: [null, 20]}

  - name: ET
    grid: {n_estimators: [200,400], max_depth: [null, 20]}

  - name: DT
    grid: {max_depth: [null,20], min_samples_split: [2,5]}


data:
  input_path: data/raw/*.xlsx
  x_sheet: X
  y_sheet: Y
  target_cols: all   # ou uma lista explícita de colunas
  spectral_range: null
  drop_nans: true
  out_dir: results

preprocess:
  steps: [SNV, MSC, DETREND, SG, EMSC, EPO, SCALE]
  sg:
    window: [3,5,7,9,11,13,15,17,21,23,25]
    polyorder: 2
    deriv: [1,2]

cv:
  random_state: 42
  strategies:
    - type: kfold
      n_splits: [5,10]
      n_repeats: 2
    - type: loo
    - type: holdout
      test_size: 0.3

models:
  - name: PLSDA
    # Mantenha `n_components` abaixo de 80% de min(n_amostras - 1, n_variáveis)
    grid: {n_components: [5,10,15], method: [logreg, lda], C: [0.5,1.0,2.0]}
    # overfit_check: false  # desativa Y-scrambling (ativo por padrão)
  - name: SVM_RBF
    grid: {C: [0.5,1.0,2.0], gamma: [scale, auto]}
    # overfit_check: false  # desativa Y-scrambling (ativo por padrão)
  - name: RF
    grid: {n_estimators: [200,400], max_depth: [null, 20]}
    # overfit_check: false  # desativa Y-scrambling (ativo por padrão)

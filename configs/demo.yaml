data:
  input_path: data/demo.csv
  target_cols: [target]
  out_dir: results

preprocess:
  steps: [SNV]

models:
  - name: PLSDA
    # Mantenha `n_components` abaixo de 80% de min(n_amostras - 1, n_variáveis)
    grid: {n_components: [2], method: [logreg, lda]}
    # y_scramble_n_iter: 5  # reduz iterações de Y-scrambling (0 desativa)
    # overfit_check: false  # desativa Y-scrambling por completo

cv:
  random_state: 0
  inner_folds: 2
  strategies:
    - type: kfold
      n_splits: [2]
      n_repeats: 1

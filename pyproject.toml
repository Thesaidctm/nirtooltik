[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nircls"
version = "0.1.0"
description = "NIR Species Classification Toolkit (CLI + pipelines + reports)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn>=1.3",
  "scipy",
  "matplotlib",
  "seaborn",
  "rich",
  "pyyaml",
  "joblib",
  "openpyxl",
  "tqdm",
  "pydantic<2",
  "plotly",
  "kaleido",
]

[project.optional-dependencies]
xgboost = ["xgboost"]
lightgbm = ["lightgbm"]
catboost = ["catboost"]
torch = ["torch"]
questionary = ["questionary"]

[project.scripts]
nircls = "nircls.cli:main"
nircls-dashboard = "nircls.dashboard:main"

[tool.setuptools.package-data]
nircls = ["run_dashboard.sh", "run_dashboard.bat"]


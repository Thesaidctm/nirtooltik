[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nircls"
version = "0.1.0"
description = "NIR Species Classification Toolkit (CLI + pipelines + reports)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Thalles Loiola Dias"}]
urls = {"Homepage" = "https://github.com/Thesaidctm/nirtooltik"}
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn>=1.3",
  "scipy",
  "matplotlib",
  "seaborn",
  "rich",
  "pyyaml",
  "joblib",
  "psutil",
  "openpyxl",
  "tqdm",
  "keyring",
  "pydantic<2",
  "plotly",
  "kaleido",
]

[project.optional-dependencies]
xgboost = ["xgboost"]
lightgbm = ["lightgbm"]
catboost = ["catboost"]
torch = ["torch"]
questionary = ["questionary"]
dvc = ["dvc"]
tracking = ["mlflow", "dvc"]
shap = ["shap"]
dev = ["mypy"]

[project.scripts]
nircls = "nircls.cli:main"
nircls-dashboard = "nircls.dashboard:main"

[project.entry-points."nircls.model_builders"]
# Third-party packages can register their builders here

[tool.setuptools.package-data]
nircls = ["run_dashboard.sh", "run_dashboard.bat", ".streamlit/config.toml"]


[tool.black]
line-length = 88
target-version = ["py39"]

[flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

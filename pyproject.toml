[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nircls"
version = "0.1.0"
description = "NIR Species Classification Toolkit (CLI + pipelines + reports)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Thalles Loiola Dias"}]
urls = {"Homepage" = "https://github.com/Thesaidctm/nirtooltik"}
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.22",
  "pandas>=1.5",
  "scikit-learn>=1.3",
  "scipy>=1.9",
  "pyyaml",
  "joblib",
  "tqdm",
  "rich",
  "psutil",
  "requests",
  "pydantic<2",
  "keyring",
  "sqlalchemy>=1.4",
  "alembic>=1.13",
  "fastapi>=0.95",
  "itsdangerous>=2.1",
  "bcrypt",
  "PyJWT>=2.8",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7", "seaborn>=0.12", "plotly>=5.15", "kaleido>=0.2.1"]
excel = ["openpyxl>=3.1"]
dashboard = ["streamlit>=1.25", "httpx>=0.24", "keyring"]
xgboost = ["xgboost"]
lightgbm = ["lightgbm"]
catboost = ["catboost"]
torch = ["torch"]
questionary = ["questionary"]
dvc = ["dvc"]
tracking = ["mlflow", "dvc"]
shap = ["shap"]
full = [
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "plotly>=5.15",
  "kaleido>=0.2.1",
  "openpyxl>=3.1",
  "streamlit>=1.25",
  "httpx>=0.24",
  "questionary",
  "xgboost",
  "lightgbm",
  "catboost",
  "torch",
  "mlflow",
  "dvc",
  "shap",
]
dev = ["mypy", "black", "ruff", "pre-commit"]

[project.scripts]
nircls = "nircls.cli:main"
nircls-dashboard = "nircls.dashboard:main"

[project.entry-points."nircls.model_builders"]
# Third-party packages can register their builders here

[tool.setuptools.package-data]
nircls = [
  "run_dashboard.sh",
  "run_dashboard.bat",
  ".streamlit/config.toml",
  "db/alembic.ini",
  "db/alembic/script.py.mako",
  "db/alembic/versions/*.py",
]


[tool.black]
line-length = 88
target-version = ["py39"]

[flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

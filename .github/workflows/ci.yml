name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          pip install -r requirements-lock.txt
          pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files
      - name: Run tests
        run: pytest
